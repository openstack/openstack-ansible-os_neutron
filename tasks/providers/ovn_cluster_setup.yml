# Checking if ovn db are clustered or not, if not then this is fresh node.
- name: Check if ovn db is clustered
  ansible.builtin.command: ovsdb-tool db-is-clustered /var/lib/ovn/ovnnb_db.db
  ignore_errors: true
  failed_when: false
  changed_when: false
  register: _check_cluster_db

# We need to clean existing ovn db/lock file before cluster join.
- name: Clean up db/lock files before creating ovn cluster
  when:
    - _check_cluster_db.rc != 0
  block:
    - name: Stop ovn services
      ansible.builtin.service:
        name: "{{ neutron_ovn_northd_service_name }}"
        state: stopped

    - name: Clean up ovn db directory
      ansible.builtin.file:
        path: /var/lib/ovn/
        state: absent

# We are finding leader node so new nodes use leader to join cluster.
- name: Find leader node in ovn cluster
  ansible.builtin.shell: ovs-appctl -t /var/run/ovn/ovnnb_db.ctl cluster/status OVN_Northbound | sed 's/ //g' | grep -oP '(?<=Role:).*'
  args:
    executable: /bin/bash
  ignore_errors: true
  delegate_to: "{{ container }}"
  with_items: "{{ groups['neutron_ovn_northd'] }}"
  loop_control:
    loop_var: container
  run_once: true
  failed_when: false
  changed_when: false
  register: _find_leader

# Set leader_node variable
- name: Set leader_node fact
  ansible.builtin.set_fact:
    leader_node: "{{ (_find_leader.results | selectattr('stdout', 'search', 'leader')) | map(attribute='container') | list }}"

- name: Join node to existing OVN cluster
  when:
    - _check_cluster_db.rc != 0
    - (leader_node | default([]) | length) > 0
  block:
    - name: Configure temporary OVN options to join cluster
      vars:
        __neutron_ovn_cluster_leader_node: "{{ leader_node | first }}"
      ansible.builtin.template:
        src: ovn-northd-opts.j2
        dest: "{{ neutron_ovn_northd_opts_file }}"
        mode: "0644"

    - name: Start OVN service to join cluster
      ansible.builtin.service:
        name: "{{ neutron_ovn_northd_service_name }}"
        state: started

    - name: Wait for OVN DBs to finish joining the cluster
      ansible.builtin.command: "ovs-appctl -t /var/run/ovn/{{ db.sock }} cluster/status {{ db.name }}"
      register: _cluster_status
      until: "'Status: cluster member' in _cluster_status.stdout"
      retries: 30
      delay: 2
      changed_when: false
      loop:
        - name: OVN_Northbound
          sock: ovnnb_db.ctl
        - name: OVN_Southbound
          sock: ovnsb_db.ctl
      loop_control:
        loop_var: db

    - name: Remove orphaned members from OVN cluster
      vars:
        _neutron_ovn_orphan_members: |-
          {% set orphans = [] %}
          {% for res in _cluster_status.results %}
          {%   for line in res.stdout_lines %}
          {%     if ' at ' ~ [ovn_proto, management_address] | join(':') in line and '(self)' not in line %}
          {%       set sid = line.strip().split() | first %}
          {%       if sid %}
          {%         set _ = orphans.append({'sock': res.db.sock, 'name': res.db.name, 'sid': sid}) %}
          {%       endif %}
          {%     endif %}
          {%   endfor %}
          {% endfor %}
          {{ orphans }}
      ansible.builtin.command:
        argv:
          - ovs-appctl
          - -t
          - "/var/run/ovn/{{ orphan.sock }}"
          - cluster/kick
          - "{{ orphan.name }}"
          - "{{ orphan.sid }}"
      loop: "{{ _neutron_ovn_orphan_members }}"
      loop_control:
        label: "{{ orphan.name }}: {{ orphan.sid }}"
        loop_var: orphan
      changed_when: true

- name: Deploy persistent OVN northd options
  ansible.builtin.template:
    src: ovn-northd-opts.j2
    dest: "{{ neutron_ovn_northd_opts_file }}"
    mode: "0644"
  notify:
    - start ovn service
    - restart ovn service

- name: Bootstrap fresh OVN cluster on primary node
  when:
    - inventory_hostname == neutron_ovn_primary_cluster_node
    - _check_cluster_db.rc != 0
    - (leader_node | default([]) | length) == 0
  block:
    - name: Start primary OVN service
      ansible.builtin.service:
        name: "{{ neutron_ovn_northd_service_name }}"
        state: started

    - name: Configure connection settings for ovn-nb and ovn-sb
      ansible.builtin.command: "{{ cmd }}"
      changed_when: true
      with_items:
        - "ovn-nbctl --inactivity-probe={{ neutron_ovn_nb_inactivity_probe }} set-connection p{{ ovn_proto }}:6641"
        - "ovn-sbctl --inactivity-probe={{ neutron_ovn_sb_inactivity_probe }} set-connection p{{ ovn_proto }}:6642"
      loop_control:
        loop_var: cmd
      register: _ovn_connection_settings
      until: _ovn_connection_settings is success
      retries: 5
      delay: 2
      notify:
        - Sync OVN northd
      tags:
        - neutron_ovn-config
